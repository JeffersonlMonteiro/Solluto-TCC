<div class="login-container">
    <h2> Login </h2>
    <form (ngSubmit)="onSubmit()">
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="digite seu email" class="form-control" />   
    </div>
<div class="form-group">
    <label for="password">Senha</label>
    <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="digite sua senha" class="form-control" />   
</div>
<button type="submit" class="btn btn-primary">Entrar</button>
</form>
